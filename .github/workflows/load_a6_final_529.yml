name: Daily CMS Stock Data Update

on:
  workflow_dispatch:

  schedule:
    # 美股周一到周五收盘后运行
    # 00:30 UTC = 多伦多前一天晚上 8:30 EDT / 7:30 EST
    - cron: "30 0 * * 2-6"

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Update stock_daily incrementally
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python load_stock_daily_529.py

      - name: Adjust new daily prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python adjust_stock_daily_529.py
