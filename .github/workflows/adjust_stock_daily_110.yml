name: Adjust 110 Stock Daily Data

on:
  workflow_dispatch:

jobs:
  adjust-110:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Build adjusted OHLC and write to Supabase
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python adjust_stock_daily_110.py

      - name: Upload adjustment status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adjust-110-status
          path: adjust_110_status.csv
          if-no-files-found: warn
