name: A Daily Production Pipeline
permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  schedule:
    # Monday-Friday at 19:00 Toronto local time (DST-aware).
    - cron: "00 19 * * 1-5"
      timezone: "America/Toronto"
    # Backup at 19:17 if the primary schedule was dropped or failed.
    - cron: "17 19 * * 1-5"
      timezone: "America/Toronto"

concurrency:
  group: cms-a-daily-production
  cancel-in-progress: false

jobs:
  a-daily-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TZ: America/New_York
      BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      TRACKER_SHEET_NAME: ${{ secrets.TRACKER_SHEET_NAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for an earlier evening production run
        id: schedule_guard
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: a_daily_pipeline.yml
          CUTOFF_HOUR: "19"
          CUTOFF_MINUTE: "0"
        run: python -u schedule_run_guard.py
      - name: 0 - Safety guard - forbid historical BusinessQuant fetch
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -u guard_no_historical_fetch.py

      - name: Install dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lxml gspread google-auth

      - name: 1 - TRUE incremental update of raw EOD
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -u load_stock_daily.py

      - name: 2 - Supabase-only adjusted OHLC maintenance
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -u adjust_stock_daily.py

      - name: 3 - Run KD-Core daily selection and Telegram summary
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -u a_daily_runner.py

      - name: 4 - Delete stock_daily bars older than 365 days
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -u prune_stock_daily.py
