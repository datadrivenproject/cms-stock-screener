name: A Daily Production Pipeline

on:
  workflow_dispatch:
  schedule:
    # 22:30 UTC = 18:30 EDT / 17:30 EST.
    # Runs after regular US market close; one pipeline owns the whole A sequence.
    - cron: "30 22 * * 1-5"

concurrency:
  group: cms-a-daily-production
  cancel-in-progress: false

jobs:
  a-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: America/New_York
      BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      TRACKER_SHEET_NAME: ${{ secrets.TRACKER_SHEET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests gspread google-auth streamlit

      - name: 1 - Update 122 raw EOD
        run: |
          python update_stock_daily_122.py

      - name: 2 - Rebuild adjusted OHLC for 122
        run: |
          python adjust_stock_daily_122.py

      - name: 3 - Run frozen A5.2R from production app.py
        run: |
          python a_daily_runner.py
