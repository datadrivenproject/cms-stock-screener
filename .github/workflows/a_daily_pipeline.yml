name: A Daily Data Pipeline

on:
  workflow_dispatch:
  schedule:
    # 22:30 UTC = 18:30 EDT / 17:30 EST
    # Monday-Friday after US market close
    - cron: "30 22 * * 1-5"

concurrency:
  group: cms-a-daily-data
  cancel-in-progress: false

jobs:
  a-daily-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: America/New_York
      BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 1 - Incrementally update 529 raw EOD
        run: |
          python load_stock_daily_529.py

      - name: 2 - Rebuild adjusted OHLC for 529
        run: |
          python adjust_stock_daily_529.py
