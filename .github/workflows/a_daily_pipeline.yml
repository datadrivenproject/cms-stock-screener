name: A Daily Production Pipeline

on:
  workflow_dispatch:
  schedule:
    # 22:30 UTC = 18:30 EDT / 17:30 EST
    # Monday-Friday after US market close
    - cron: "30 22 * * 1-5"

concurrency:
  group: cms-a-daily-production
  cancel-in-progress: false

jobs:
  a-daily-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TZ: America/New_York
      BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      TRACKER_SHEET_NAME: ${{ secrets.TRACKER_SHEET_NAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # HARD SAFETY GATE — MUST RUN BEFORE ANY MARKET-DATA REQUEST.
      # Blocks production if period=1y/history loading is reintroduced or if
      # adjust_stock_daily.py ever contains BusinessQuant access again.
      - name: 0 - Safety guard - forbid historical BusinessQuant fetch
        run: |
          python -u guard_no_historical_fetch.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests lxml gspread google-auth

      - name: 1 - TRUE incremental update of ~1500 raw EOD
        run: |
          python -u load_stock_daily.py

      # IMPORTANT: this program must be Supabase-only.
      # guard_no_historical_fetch.py blocks the pipeline if BQ access appears here.
      - name: 2 - Supabase-only adjusted OHLC maintenance
        run: |
          python -u adjust_stock_daily.py

      - name: 3 - Run KD-Core daily selection and Telegram summary
        run: |
          python -u a_daily_runner.py

      - name: 4 - Delete stock_daily bars older than 365 days
        run: |
          python -u prune_stock_daily.py
