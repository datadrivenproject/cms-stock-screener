name: Bootstrap New Tickers

on:
  workflow_dispatch:

concurrency:
  group: cms-history-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: America/New_York
      BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests lxml
      - name: Bootstrap truly new tickers only
        run: python -u bootstrap_new_tickers_1500.py
      - name: Fill adjusted OHLC from Supabase only
        run: python -u adjust_stock_daily.py
