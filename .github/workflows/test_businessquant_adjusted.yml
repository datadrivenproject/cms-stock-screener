name: Test BusinessQuant Adjusted Prices

on:
  workflow_dispatch:

jobs:
  test-adjusted-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Compare adjusted Business Quant with Yahoo
        env:
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
        run: |
          python test_businessquant_adjusted.py

      - name: Upload comparison files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: businessquant-adjusted-test
          path: |
            businessquant_adjusted_summary.csv
            businessquant_adjusted_detail.csv
            businessquant_corporate_actions.csv
          if-no-files-found: warn
