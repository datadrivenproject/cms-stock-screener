name: B-C Cloud Monitor 15m

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run even outside market hours"
        required: false
        default: "false"
  schedule:
    # Broad UTC window covering US regular hours in both EDT and EST.
    # The Python script itself enforces 09:30–16:00 America/New_York.
    - cron: "*/15 13-21 * * 1-5"

concurrency:
  group: cms-bc-cloud-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance gspread google-auth

      - name: Run B/C cloud monitor
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TRACKER_SHEET_NAME: ${{ secrets.TRACKER_SHEET_NAME }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run == 'true' && '1' || '0' }}
        run: |
          python bc_cloud_monitor.py
